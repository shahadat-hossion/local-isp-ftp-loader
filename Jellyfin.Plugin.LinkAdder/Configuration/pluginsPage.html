<!DOCTYPE html>
<html>
<head><title>Media Source Bridge</title></head>
<body>
<div id="LocalIspPluginsPage" data-role="page" class="page type-interior">
    <div data-role="content">
        <div class="content-primary bridgeLanding">
            <section class="bridgeHero" aria-labelledby="bridgeTitle">
                <h2 id="bridgeTitle">Media Source Bridge</h2>
                <a class="bridgeDiscover" href="#/configurationpage?name=localispdiscovery">
                    <span class="material-icons explore" aria-hidden="true"></span> Discover
                </a>
            </section>
            <nav aria-label="Media Source Bridge shortcuts" class="bridgeShortcuts">
                <a href="#/configurationpage?name=localispsearch">
                    <span class="material-icons search bridgeIcon" aria-hidden="true"></span>
                    <span>Search</span><span class="bridgeArrow" aria-hidden="true">→</span>
                </a>
                <a href="#/configurationpage?name=localispimportlink">
                    <span class="material-icons link bridgeIcon" aria-hidden="true"></span>
                    <span>Import Link</span><span class="bridgeArrow" aria-hidden="true">→</span>
                </a>
                <a href="#/configurationpage?name=localispservers" hidden>
                    <span class="material-icons movie bridgeIcon" aria-hidden="true"></span>
                    <span>Setup Media</span><span class="bridgeArrow" aria-hidden="true">→</span>
                </a>
            </nav>
        </div>
    </div>
    <style>
        #LocalIspPluginsPage .bridgeLanding {
            --bridge-accent: #24e9f4;
            max-width: 100rem;
            margin-inline: auto;
            padding: clamp(1rem, 2.5vw, 2.5rem);
            color: #f5f8ff;
        }
        #LocalIspPluginsPage .bridgeHero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
            min-height: clamp(19rem, 34vw, 34rem);
            padding: clamp(1.5rem, 4vw, 4rem);
            border-radius: 1rem;
            background: linear-gradient(90deg, #030c1a88, transparent 80%),
                #07182b url("../LocalIspFtpLoader/cinema-hero.jpg") center / cover no-repeat;
        }
        #LocalIspPluginsPage .bridgeHero h2 {
            margin: 0 0 clamp(1.25rem, 3vw, 2.75rem);
            font-size: clamp(2.15rem, 4.5vw, 4.75rem);
            font-weight: 800;
            letter-spacing: -.035em;
            line-height: 1.05;
            text-shadow: 0 2px 16px #000b;
        }
        #LocalIspPluginsPage .bridgeDiscover {
            display: inline-flex;
            align-items: center;
            gap: .7em;
            padding: .72em 1.2em;
            border-radius: .6rem;
            background: var(--bridge-accent);
            color: #061b2e;
            font-size: clamp(1.1rem, 2vw, 2rem);
            font-weight: 800;
            text-decoration: none;
        }
        #LocalIspPluginsPage .bridgeDiscover:hover {
            background: #82f6ff;
        }
        #LocalIspPluginsPage .bridgeShortcuts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr));
            gap: clamp(.75rem, 1.4vw, 1.25rem);
            margin-top: clamp(1rem, 2.5vw, 2.5rem);
        }
        #LocalIspPluginsPage .bridgeShortcuts a:not([hidden]) {
            display: flex;
            align-items: center;
            gap: clamp(.65rem, 1.4vw, 1.35rem);
            min-height: clamp(5rem, 12vw, 11rem);
            box-sizing: border-box;
            padding: clamp(.85rem, 2vw, 2rem);
            border: 1px solid #1b4861;
            border-radius: .9rem;
            background: linear-gradient(145deg, #142e41, #0e1b29 65%);
            color: inherit;
            text-decoration: none;
            font-size: clamp(1.1rem, 2vw, 2rem);
            font-weight: 750;
        }
        #LocalIspPluginsPage .bridgeShortcuts a:hover {
            background: linear-gradient(145deg, #1a3c52, #122435 65%);
            border-color: var(--bridge-accent);
        }
        #LocalIspPluginsPage .bridgeIcon {
            display: grid;
            place-items: center;
            flex: none;
            inline-size: 2em;
            block-size: 2em;
            border-radius: .45em;
            background: #153c53;
            color: var(--bridge-accent);
            font-size: 1.25em;
        }
        #LocalIspPluginsPage .bridgeArrow {
            margin-inline-start: auto;
            color: var(--bridge-accent);
        }
        #LocalIspPluginsPage .bridgeLanding a:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }
        @media (max-width: 650px) {
            #LocalIspPluginsPage .bridgeHero {
                background-position: 55% center;
                background-image: linear-gradient(90deg, #030c1ae6, #030c1a44),
                    url("../LocalIspFtpLoader/cinema-hero.jpg");
            }
        }
    </style>
    <script type="text/javascript">
        (() => {
            const page = document.querySelector('#LocalIspPluginsPage');
            const mediaSources = page.querySelector('a[href$="name=localispservers"]');

            async function updateMediaSourcesLink() {
                mediaSources.hidden = true;
                try {
                    await ApiClient.ajax({
                        url: ApiClient.getUrl('Plugins/LinkAdder/CanManage'),
                        type: 'GET',
                        dataType: 'json'
                    });
                    mediaSources.hidden = false;
                } catch {
                    // Media Sources requires administrator access.
                }
            }

            page.addEventListener('viewshow', updateMediaSourcesLink);
            page.addEventListener('pageshow', updateMediaSourcesLink);
            updateMediaSourcesLink();
        })();
    </script>
</div>
</body>
</html>
