<!DOCTYPE html><html><head><title>Import Link</title></head><body>
<div id="LocalIspImportLinkPage" data-role="page" class="page type-interior" data-require="emby-input,emby-button,emby-select"><div data-role="content"><div class="content-primary">
<h2>Import Link</h2><p>Paste a media file or folder link from one of your configured private sources. Analyze it before creating any files.</p>
<style>
.silPanel{margin:0 0 1.5rem;padding:1rem;border:1px solid rgba(255,255,255,.18);border-radius:.5rem}.silRow{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.silActions{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.silActions .block{width:100%;margin:0!important}.silMuted{opacity:.72;font-size:.88rem}.silSummary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin:1rem 0}.silStat{padding:.8rem;border-radius:.4rem;background:rgba(255,255,255,.08)}.silStat strong{display:block;font-size:1.35rem}.silProgress{display:none;margin-top:.8rem}.silTrack{height:.65rem;background:rgba(255,255,255,.2);border-radius:1rem;overflow:hidden}.silFill{height:100%;width:0;background:#00a4dc;transition:width .25s ease}@media(max-width:600px){.silRow,.silActions,.silSummary{grid-template-columns:1fr}}
</style>
<div class="silPanel">
<div class="selectContainer"><label class="selectLabel">Media type</label><select id="mediaType" is="emby-select"><option value="movie">Movies</option><option value="series">Shows</option><option value="anime">Anime</option></select></div>
<div class="inputContainer"><label class="inputLabel">Media link</label><input id="mediaUrl" is="emby-input" inputmode="url" autocomplete="off" placeholder="http://192.168.1.10/Movies/Example Movie/"></div>
<button is="emby-button" class="raised button-submit block" id="analyzeBtn"><span>Analyze Link</span></button>
<p class="silMuted">The URL must be inside a source already configured by an administrator.</p>
</div>
<div id="analysis" style="display:none">
<div class="inputContainer"><label class="inputLabel">Detected title</label><input id="title" is="emby-input"></div>
<div class="selectContainer"><label class="selectLabel">Default save location</label><select id="library" is="emby-select" disabled></select></div>
<div class="silSummary"><div class="silStat"><strong id="fileCount">0</strong><span>stream files</span></div><div class="silStat"><strong id="seasonCount">0</strong><span>seasons</span></div><div class="silStat"><strong id="duplicateCount">—</strong><span>existing files checked on import</span></div></div>
<label class="inputLabel">Planned Jellyfin structure</label><pre id="preview" style="white-space:pre-wrap;max-height:22em;overflow:auto;padding:1rem;background:rgba(0,0,0,.18);border-radius:.4rem"></pre>
<div class="silActions"><button is="emby-button" class="raised button-submit block" id="addBtn"><span>Create STRM Files</span></button><button is="emby-button" class="raised block" id="downloadBtn" style="display:none"><span>Download Files</span></button></div>
<div id="downloadProgress" class="silProgress"><div class="silTrack"><div id="downloadFill" class="silFill"></div></div><p id="downloadText">0% — Preparing download…</p></div>
</div>
<p id="status" style="min-height:1.5em;margin-top:1em;font-weight:600"></p>
<script type="text/javascript">(function(){
const p=document.querySelector('#LocalIspImportLinkPage'),q=s=>p.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const call=async(path,method,body)=>{try{return await ApiClient.ajax({url:ApiClient.getUrl('Plugins/LinkAdder/'+path),type:method,dataType:'json',contentType:'application/json',data:body?JSON.stringify(body):undefined})}catch(e){let detail='';try{let parsed=JSON.parse(e.responseText||'{}');detail=parsed.error||parsed.detail||''}catch(_){}throw Error(detail||(e.status===401?'Sign in to Jellyfin and refresh.':'Request failed'+(e.status?' ('+e.status+')':'')))}};
const normalize=x=>({name:x.name??x.Name,path:x.path??x.Path,mediaType:x.mediaType??x.MediaType}),type=()=>q('#mediaType').value;
const renderLibraries=()=>{let path=(window.silDefaults||{})[type()]||'',item=(window.silLibraries||[]).find(x=>x.mediaType===type()&&x.path===path);q('#library').innerHTML=item?'<option value="'+esc(item.path)+'">'+esc(item.name)+'</option>':'<option value="">Not configured in Media Sources</option>';return !!item};
const reset=()=>{window.silAnalyzed=null;q('#analysis').style.display='none';q('#status').textContent=''};
async function loadPage(){reset();window.silCanManage=false;q('#downloadBtn').style.display='none';try{let [raw,s]=await Promise.all([call('Libraries','GET'),call('SearchDestinations','GET')]);window.silLibraries=raw.map(normalize);window.silDefaults={movie:s.movieLibraryPath??s.MovieLibraryPath,series:s.seriesLibraryPath??s.SeriesLibraryPath,anime:s.animeLibraryPath??s.AnimeLibraryPath};renderLibraries()}catch(e){q('#status').textContent=e.message}try{await call('CanManage','GET');window.silCanManage=true;q('#downloadBtn').style.display=''}catch(_){}}
p.addEventListener('viewshow',loadPage);p.addEventListener('pageshow',loadPage);loadPage();
q('#mediaType').onchange=()=>{reset();renderLibraries()};q('#mediaUrl').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();q('#analyzeBtn').click()}};
q('#analyzeBtn').onclick=async()=>{let url=q('#mediaUrl').value.trim(),b=q('#analyzeBtn');reset();if(!url){q('#status').textContent='Paste a media file or folder link first.';return}b.disabled=true;b.querySelector('span').textContent='Analyzing…';q('#status').textContent='Analyzing the linked media folder…';try{let x=await call('Preview','POST',{url,mediaType:type(),title:null}),title=x.title??x.Title,files=x.files??x.Files,paths=files.map(f=>f.relativePath??f.RelativePath);window.silAnalyzed={url,files};q('#title').value=title;q('#fileCount').textContent=files.length;q('#seasonCount').textContent=new Set(paths.map(v=>(v.match(/Season \d+/i)||[])[0]).filter(Boolean)).size;q('#preview').textContent=paths.map(v=>v.split(/[\\/]/).slice(1).join(' / ')).join('\n');renderLibraries();q('#analysis').style.display='';q('#status').textContent=renderLibraries()?'Analysis complete. Review the plan before importing.':'Create a compatible Jellyfin library first.'}catch(e){q('#status').textContent=e.message}finally{b.disabled=false;b.querySelector('span').textContent='Analyze Link'}};
q('#addBtn').onclick=async()=>{let item=window.silAnalyzed,option=q('#library').selectedOptions[0];if(!item||!option?.value){q('#status').textContent='Configure this media type in Default Save Locations on Media Sources.';return}if(!confirm('Create the planned STRM files in '+option.textContent+'?'))return;q('#status').textContent='Creating stream files…';try{let x=await call('Add','POST',{url:item.url,libraryPath:null,mediaType:type(),title:q('#title').value}),created=x.created??x.Created,skipped=x.skipped??x.Skipped,refresh=x.refresh??x.Refresh;q('#duplicateCount').textContent=skipped.length;q('#status').textContent='Created '+created.length+' file(s), skipped '+skipped.length+' existing. '+refresh}catch(e){q('#status').textContent=e.message}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),value=(x,n)=>x[n[0].toLowerCase()+n.slice(1)]??x[n];
q('#downloadBtn').onclick=async()=>{let item=window.silAnalyzed,option=q('#library').selectedOptions[0],b=q('#downloadBtn');if(!window.silCanManage){q('#status').textContent='Only an administrator can download media.';return}if(!item||!option?.value){q('#status').textContent='Configure this media type in Default Save Locations on Media Sources.';return}if(!confirm('Download the actual media files to '+option.textContent+'?'))return;b.disabled=true;q('#addBtn').disabled=true;q('#downloadProgress').style.display='block';q('#status').textContent='Download started on the Jellyfin server.';try{let started=await call('Downloads','POST',{url:item.url,libraryPath:null,mediaType:type(),title:q('#title').value}),id=value(started,'JobId');for(;;){await sleep(750);let job=await call('Downloads/'+encodeURIComponent(id),'GET'),state=value(job,'Status'),percentage=Number(value(job,'Percentage')||0),message=value(job,'Message')||'';q('#downloadFill').style.width=Math.max(0,Math.min(100,percentage))+'%';q('#downloadText').textContent=percentage.toFixed(1).replace('.0','')+'% — '+message;if(state==='complete'){q('#duplicateCount').textContent=value(job,'Skipped');q('#status').textContent='Downloaded '+value(job,'Downloaded')+' file(s), skipped '+value(job,'Skipped')+' existing. '+message;break}if(state==='failed')throw Error(message)}}catch(e){q('#status').textContent=e.message}finally{b.disabled=false;q('#addBtn').disabled=false}};
})();</script></div></div></div></body></html>
