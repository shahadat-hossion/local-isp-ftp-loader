<!DOCTYPE html><html><head><title>Sam Online FTP Loader</title></head><body>
<div id="FtpLoaderPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select"><div data-role="content"><div class="content-primary">
<h2>Sam Online FTP Loader</h2><p>Search the private Sam Online media server, select a result, and add it to Jellyfin. This plugin only works on networks that can access the configured Sam Online servers.</p>
<style>.ftpGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem}.ftpCard{display:flex!important;flex-direction:column;padding:0!important;overflow:hidden;text-align:left!important;background:#18263d!important;border-radius:.5rem;min-height:260px}.ftpPoster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#101a2a}.ftpCardBody{padding:.7rem;display:flex;flex-direction:column;gap:.35rem}.ftpCardTitle{font-weight:700;line-height:1.25}.ftpCardSource{font-size:.82rem;opacity:.7}</style>
<div class="selectContainer"><label class="selectLabel">Media type</label><select id="mediaType" is="emby-select"><option value="movie">Movies</option><option value="series">Shows</option><option value="anime">Anime</option></select></div>
<div class="inputContainer"><label class="inputLabel">Name</label><input id="searchName" is="emby-input" placeholder="Aquaman"></div>
<button is="emby-button" class="raised button-submit block" id="searchBtn">Search</button>
<div id="results" style="margin-top:1.5em"></div>
<div id="selection" style="display:none;margin-top:2em;border-top:1px solid rgba(255,255,255,.2);padding-top:1.5em">
<div class="inputContainer"><label class="inputLabel">Title</label><input id="title" is="emby-input"></div>
<div class="selectContainer"><label class="selectLabel">Add to Jellyfin library</label><select id="library" is="emby-select"></select></div>
<p id="summary"></p><pre id="preview" style="white-space:pre-wrap;max-height:18em;overflow:auto"></pre>
<button is="emby-button" class="raised button-submit block" id="addBtn">Add to library</button></div>
<p id="status" style="min-height:1.5em;margin-top:1em;font-weight:600"></p>
<script type="text/javascript">(function(){const p=document.querySelector('#FtpLoaderPage'),q=s=>p.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),call=async(path,method,body)=>{try{return await ApiClient.ajax({url:ApiClient.getUrl('Plugins/LinkAdder/'+path),type:method,dataType:'json',contentType:'application/json',data:body?JSON.stringify(body):undefined})}catch(e){let detail='';try{let parsed=JSON.parse(e.responseText||'{}');detail=parsed.error||parsed.detail||''}catch(_){}throw Error(detail||(e.status===401?'Sign in as an administrator and refresh.':e.status===403?'Administrator access is required.':'Request failed'+(e.status?' ('+e.status+')':''))) }},normalize=x=>({name:x.name??x.Name,path:x.path??x.Path,mediaType:x.mediaType??x.MediaType}),currentType=()=>q('#mediaType').value,renderLibraries=()=>{let items=(window.ftpLoaderLibraries||[]).filter(x=>x.mediaType===currentType());q('#library').innerHTML=items.map(x=>'<option value="'+esc(x.path)+'">'+esc(x.name)+'</option>').join('');return items.length},clearSelection=()=>{window.ftpLoaderSelected=null;q('#selection').style.display='none'};
const loadLibraries=async()=>{try{let raw=await call('Libraries','GET');window.ftpLoaderLibraries=raw.map(normalize);renderLibraries()}catch(e){q('#status').textContent=e.message}};p.addEventListener('viewshow',loadLibraries);p.addEventListener('pageshow',loadLibraries);loadLibraries();
q('#mediaType').onchange=()=>{q('#results').innerHTML='';clearSelection();renderLibraries();q('#status').textContent=''};
q('#searchName').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();q('#searchBtn').click()}};
q('#searchBtn').onclick=async()=>{let query=q('#searchName').value.trim();q('#results').innerHTML='';clearSelection();q('#status').textContent='Searching the remote server…';try{let raw=await call('Remote/Search','POST',{mediaType:currentType(),query}),items=raw.map(x=>({name:x.name??x.Name,url:x.url??x.Url,source:x.source??x.Source,posterUrl:x.posterUrl??x.PosterUrl}));window.ftpLoaderResults=items;q('#results').innerHTML='<div class="ftpGrid">'+items.map((x,i)=>'<button is="emby-button" class="ftpCard ftpResult" data-index="'+i+'">'+(x.posterUrl?'<img class="ftpPoster" src="'+esc(x.posterUrl)+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">':'<span class="ftpPoster"></span>')+'<span class="ftpCardBody"><span class="ftpCardTitle">'+esc(x.name)+'</span><span class="ftpCardSource">'+esc(x.source)+'</span></span></button>').join('')+'</div>';q('#results').querySelectorAll('.ftpResult').forEach(b=>b.onclick=()=>selectResult(items[+b.dataset.index]));q('#status').textContent=items.length?items.length+' result(s) found. Select one.':'No matching titles found.'}catch(e){q('#status').textContent=e.message}};
async function selectResult(item){window.ftpLoaderSelected=item;q('#status').textContent='Loading '+item.name+'…';try{let x=await call('Preview','POST',{url:item.url,mediaType:currentType(),title:null}),title=x.title??x.Title,files=x.files??x.Files;q('#title').value=title;renderLibraries();q('#summary').textContent=files.length+' stream file(s) found.';q('#preview').textContent=files.map(f=>(f.relativePath??f.RelativePath).split(/[\\/]/).slice(1).join(' / ')).join('\n');q('#selection').style.display='';q('#status').textContent='Ready to add.'}catch(e){clearSelection();q('#status').textContent=e.message}}
q('#addBtn').onclick=async()=>{let item=window.ftpLoaderSelected,option=q('#library').selectedOptions[0];if(!item||!option){q('#status').textContent='Choose a result and destination library.';return}if(!confirm('Add '+q('#title').value+' to '+option.textContent+'?'))return;q('#status').textContent='Adding…';try{let x=await call('Add','POST',{url:item.url,libraryPath:option.value,mediaType:currentType(),title:q('#title').value}),created=x.created??x.Created,skipped=x.skipped??x.Skipped,refresh=x.refresh??x.Refresh;q('#status').textContent='Created '+created.length+' file(s), skipped '+skipped.length+' existing. '+refresh;clearSelection()}catch(e){q('#status').textContent=e.message}};
})();</script></div></div></div></body></html>
