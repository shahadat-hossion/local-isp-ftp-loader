<!DOCTYPE html><html><head><title>Search &amp; Add Media</title></head><body>
<div id="LocalIspUnifiedSearchPage" data-role="page" class="page type-interior" data-require="emby-input,emby-button"><div data-role="content"><div class="content-primary lidSearchPage">
<style>
.lidSearchPage{max-width:1200px}.lidSearchBox{display:flex;align-items:center;gap:.65rem;margin:1rem 0 1.4rem}.lidSearchBox .inputContainer{flex:1;margin:0}.lidSearchBox button{min-width:7rem}.lidSection{margin:1.4rem 0 2.2rem}.lidSectionHead{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}.lidMuted{opacity:.7}.lidGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:1rem}.lidCard{display:flex;flex-direction:column;min-width:0;background:rgba(24,38,61,.82);border-radius:.55rem;overflow:hidden}.lidPoster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#101a2a}.lidPosterFallback{display:grid;place-items:center;font-size:3rem}.lidBody{display:flex;flex:1;flex-direction:column;gap:.35rem;padding:.75rem}.lidTitle{font-weight:700;line-height:1.25}.lidMeta{font-size:.82rem;opacity:.72}.lidAction{margin-top:auto!important;width:100%}.lidLocal{border:1px solid rgba(0,164,220,.5)}.lidRemote{border:1px solid rgba(255,255,255,.12)}.lidBadge{display:inline-block;width:max-content;padding:.13rem .4rem;border-radius:.3rem;background:rgba(0,164,220,.25);font-size:.75rem;font-weight:700}.lidStatus{min-height:1.5em;font-weight:600}.lidAdmin{margin-top:3rem;padding:1rem;border:1px solid rgba(255,255,255,.18);border-radius:.5rem}.lidCheck{display:flex;align-items:center;gap:.6rem}.lidSpinner{display:inline-block;width:1rem;height:1rem;border:.15rem solid rgba(255,255,255,.25);border-top-color:#00a4dc;border-radius:50%;animation:lidSpin .7s linear infinite}@keyframes lidSpin{to{transform:rotate(360deg)}}@media(max-width:600px){.lidSearchBox{align-items:stretch;flex-direction:column}.lidGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}}
</style>
<h2>Search &amp; Add Media</h2><p class="lidMuted">Search your Jellyfin library and configured private FTP or HTTP servers together.</p>
<div class="lidSearchBox"><div class="inputContainer"><label class="inputLabel" for="lidQuery">Movie, show or anime</label><input id="lidQuery" is="emby-input" autocomplete="off" placeholder="Iron Man"></div><button id="lidSearch" is="emby-button" class="raised button-submit"><span>Search</span></button></div>
<p id="lidStatus" class="lidStatus" aria-live="polite"></p>
<section id="lidLocalSection" class="lidSection" hidden><div class="lidSectionHead"><h3>In Your Library</h3><span id="lidLocalCount" class="lidMuted"></span></div><div id="lidLocal" class="lidGrid"></div></section>
<section id="lidRemoteSection" class="lidSection" hidden><div class="lidSectionHead"><h3>Available from Media Servers</h3><span id="lidRemoteCount" class="lidMuted"></span></div><div id="lidRemote" class="lidGrid"></div></section>
<details id="lidAdmin" class="lidAdmin" hidden><summary><strong>Search button settings</strong></summary><p class="lidMuted">Choose whether this unified search replaces Jellyfin's standard header search button.</p><label class="lidCheck"><input id="lidReplaceSearch" type="checkbox" is="emby-checkbox"><span>Replace Jellyfin's default search button</span></label><button id="lidSaveSettings" is="emby-button" class="raised"><span>Save</span></button><p id="lidSettingsStatus" class="lidMuted"></p></details>
<script>(function(){
const page=document.querySelector('#LocalIspUnifiedSearchPage'),q=s=>page.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),value=(x,n)=>x?.[n[0].toLowerCase()+n.slice(1)]??x?.[n];
const call=async(path,method='GET',body)=>{try{return await ApiClient.ajax({url:ApiClient.getUrl('Plugins/LinkAdder/'+path),type:method,dataType:'json',contentType:'application/json',data:body?JSON.stringify(body):undefined})}catch(e){let detail='';try{const parsed=JSON.parse(e.responseText||'{}');detail=parsed.error||parsed.detail||''}catch(_){}throw Error(detail||'Request failed'+(e.status?' ('+e.status+')':''))}};
let libraries=[],searchToken=0,localItems=[];
const image=item=>item.ImageTags?.Primary?ApiClient.getScaledImageUrl(item.Id,{type:'Primary',maxWidth:360,tag:item.ImageTags.Primary}):'';
const kind=item=>item.Type==='Movie'?'movie':item.Type==='Series'||item.Type==='Episode'?'series':'movie';
const norm=s=>String(s||'').toLowerCase().replace(/\b(19|20)\d{2}\b/g,' ').replace(/\b(2160p|1080p|720p|480p|4k|uhd|bluray|web[- .]?dl|webrip|brrip|hdrip|dvdrip|x26[45]|hevc|aac|esub|msubs?)\b.*$/i,' ').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const localKey=item=>norm(item.SeriesName||item.Name);
const poster=(url,title)=>url?'<img class="lidPoster" src="'+esc(url)+'" alt="'+esc(title)+' poster" loading="lazy" onerror="this.outerHTML=\'<span class=&quot;lidPoster lidPosterFallback&quot; aria-hidden=&quot;true&quot;>▣</span>\'">':'<span class="lidPoster lidPosterFallback" aria-hidden="true">▣</span>';
function navigateItem(id){if(window.Dashboard?.navigate)Dashboard.navigate('details?id='+encodeURIComponent(id));else window.location.hash='#/details?id='+encodeURIComponent(id)}
async function playItem(item){try{const player=window.playbackManager||window.PlaybackManager;if(player?.play){await player.play({items:[item]});return}}catch(_){}navigateItem(item.Id)}
function renderLocal(items){localItems=items;q('#lidLocalSection').hidden=!items.length;q('#lidLocalCount').textContent=items.length+' result'+(items.length===1?'':'s');q('#lidLocal').innerHTML=items.map((x,i)=>'<article class="lidCard lidLocal">'+poster(image(x),x.Name)+'<div class="lidBody"><span class="lidBadge">In library</span><span class="lidTitle">'+esc(x.Name)+'</span><span class="lidMeta">'+esc(x.Type)+(x.ProductionYear?' · '+x.ProductionYear:'')+'</span><button is="emby-button" class="raised button-submit lidAction lidPlay" data-index="'+i+'"><span>'+(x.Type==='Movie'||x.Type==='Episode'?'Play':'Open')+'</span></button></div></article>').join('');q('#lidLocal').querySelectorAll('.lidPlay').forEach(b=>b.onclick=()=>{const item=items[+b.dataset.index];item.Type==='Movie'||item.Type==='Episode'?playItem(item):navigateItem(item.Id)})}
async function searchLocal(query,token){const result=await ApiClient.getItems(ApiClient.getCurrentUserId(),{SearchTerm:query,IncludeItemTypes:'Movie,Series,Episode',Recursive:true,Limit:30,Fields:'PrimaryImageAspectRatio,ProductionYear,SeriesName,Path',ImageTypeLimit:1,EnableImageTypes:'Primary'});if(token!==searchToken)return [];const items=(result.Items||[]).filter(x=>x.Type!=='Episode'||norm(x.Name).includes(norm(query))||norm(x.SeriesName).includes(norm(query)));renderLocal(items);return items}
const remoteType=x=>x.type,remoteKey=x=>norm(x.name);
function renderRemote(items){const localKeys=new Set(localItems.map(localKey));q('#lidRemoteSection').hidden=false;q('#lidRemoteCount').textContent=items.length+' result'+(items.length===1?'':'s');q('#lidRemote').innerHTML=items.length?items.map((x,i)=>{const exists=localKeys.has(remoteKey(x));return '<article class="lidCard lidRemote">'+poster(x.posterUrl,x.name)+'<div class="lidBody"><span class="lidBadge">'+esc(x.type==='movie'?'Movie':x.type==='anime'?'Anime':'Show')+'</span><span class="lidTitle">'+esc(x.name)+'</span><span class="lidMeta">'+esc(x.source)+'</span><button is="emby-button" class="raised '+(exists?'':'button-submit')+' lidAction lidAdd" data-index="'+i+'" '+(exists?'disabled':'')+'><span>'+(exists?'Already in Library':x.type==='movie'?'Add & Play':'Add & Open')+'</span></button></div></article>'}).join(''):'<p class="lidMuted">No matching titles were found on configured media servers.</p>';q('#lidRemote').querySelectorAll('.lidAdd:not([disabled])').forEach(b=>b.onclick=()=>addRemote(items[+b.dataset.index],b))}
async function searchRemote(query,token){q('#lidStatus').innerHTML='<span class="lidSpinner"></span> Searching configured media servers…';const types=['movie','series','anime'];const settled=await Promise.allSettled(types.map(type=>call('Remote/Search','POST',{mediaType:type,query}).then(rows=>rows.map(x=>({name:value(x,'Name'),url:value(x,'Url'),source:value(x,'Source'),posterUrl:value(x,'PosterUrl'),type})))));if(token!==searchToken)return;const items=settled.flatMap(x=>x.status==='fulfilled'?x.value:[]).filter((x,i,a)=>a.findIndex(y=>y.url===x.url&&y.type===x.type)===i);renderRemote(items);const failures=settled.filter(x=>x.status==='rejected').length;q('#lidStatus').textContent=items.length?'Local results are shown first. Select Add to import a remote title.':failures===types.length?'Media servers could not be searched.':'Search complete.'}
async function findIndexed(item,title){const wanted=norm(title),end=Date.now()+90000;while(Date.now()<end){const result=await ApiClient.getItems(ApiClient.getCurrentUserId(),{SearchTerm:title,IncludeItemTypes:item.type==='movie'?'Movie':'Series',Recursive:true,Limit:20,Fields:'Path,ProductionYear'});const match=(result.Items||[]).find(x=>norm(x.Name)===wanted||norm(x.Name).startsWith(wanted+' '));if(match)return match;await new Promise(r=>setTimeout(r,2500))}return null}
async function addRemote(item,button){const choices=libraries.filter(x=>x.mediaType===item.type||(item.type==='anime'&&x.mediaType==='series'));if(!choices.length){q('#lidStatus').textContent='Create a compatible Jellyfin library before adding this title.';return}let library=choices[0];if(choices.length>1){const names=choices.map((x,i)=>(i+1)+'. '+x.name).join('\n'),answer=prompt('Choose the destination library:\n'+names,'1'),index=Number(answer)-1;if(!Number.isInteger(index)||!choices[index])return;library=choices[index]}const label=button.querySelector('span'),original=label.textContent;button.disabled=true;label.textContent='Adding…';q('#lidStatus').textContent='Creating STRM files for '+item.name+'…';try{const added=await call('Add','POST',{url:item.url,libraryPath:library.path,mediaType:item.type,title:item.name});const created=value(added,'Created')||[],skipped=value(added,'Skipped')||[];label.textContent='Waiting for Jellyfin…';q('#lidStatus').textContent='Created '+created.length+' file(s), skipped '+skipped.length+'. Waiting for Jellyfin to index the title…';const indexed=await findIndexed(item,item.name);if(!indexed){label.textContent='Added';q('#lidStatus').textContent='Added successfully. Jellyfin is still indexing it; open the library shortly.';return}label.textContent=item.type==='movie'?'Playing…':'Opening…';q('#lidStatus').textContent='Added to '+library.name+'.';if(item.type==='movie')await playItem(indexed);else navigateItem(indexed.Id)}catch(e){button.disabled=false;label.textContent=original;q('#lidStatus').textContent=e.message}}
async function runSearch(){const query=q('#lidQuery').value.trim();if(query.length<2){q('#lidStatus').textContent='Enter at least two characters.';return}const token=++searchToken;q('#lidLocalSection').hidden=true;q('#lidRemoteSection').hidden=true;q('#lidStatus').innerHTML='<span class="lidSpinner"></span> Searching your library…';try{await searchLocal(query,token)}catch(e){if(token===searchToken)q('#lidStatus').textContent='Local search failed: '+e.message}if(token!==searchToken)return;searchRemote(query,token)}
async function load(){try{const raw=await call('Libraries');libraries=raw.map(x=>({name:value(x,'Name'),path:value(x,'Path'),mediaType:value(x,'MediaType')}))}catch(e){q('#lidStatus').textContent=e.message}try{const settings=await call('SearchUiSettings');q('#lidReplaceSearch').checked=Boolean(value(settings,'ReplaceDefaultSearch'))}catch(_){}try{await call('CanManage');q('#lidAdmin').hidden=false}catch(_){q('#lidAdmin').hidden=true}setTimeout(()=>q('#lidQuery').focus(),100)}
q('#lidSearch').onclick=runSearch;q('#lidQuery').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();runSearch()}};q('#lidSaveSettings').onclick=async()=>{try{await call('SearchUiSettings','POST',{replaceDefaultSearch:q('#lidReplaceSearch').checked});q('#lidSettingsStatus').textContent='Saved. Refresh Jellyfin to update the header buttons.'}catch(e){q('#lidSettingsStatus').textContent=e.message}};page.addEventListener('viewshow',load);page.addEventListener('pageshow',load);load();
})();</script>
</div></div></div></body></html>
